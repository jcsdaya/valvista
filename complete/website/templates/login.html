<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href='{% static "media/vlogos.png" %}' type="image/png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">
    <title>Login Page | ValVista</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'loginss.css' %}">
</head>
<body>

   <header>
      <div style= "background-image: url('https://valenzuela.gov.ph/ckuploads/images/cityhall_facade.jpg'); background-size: cover;background-position: center;"></div>
      
      <nav>
         <div class="logo">
            <a href="{%url 'home' %}"><img class="logo"src ='{% static "media/valvista_logo.png" %}' alt="logo"></a>
         </div>
 
         <ul class="nav-links">
           
            <li><a href="{%url 'home' %}"><i class="fa-solid fa-house"></i> Home</a></li>
         </ul>
            <ul class="nav-links ul-user">
            <li><a href="{%url 'login' %}"><i class="fa-solid fa-right-to-bracket"></i> Login</a></li>
            
         </ul>
       
         
     </nav>
    </header>
    <br><br><br><br><br>
    <div class="login">
      <div class="image-holder">
         <video class="video-gif" autoplay muted playsinline>
             <source src='{% static "media/gif.mp4" %}' type="video/mp4">
             Your browser does not support the video tag.
         </video>
     </div>
     
      <form action=" "  class="login__form" method="POST">
         {% csrf_token %}
         {% if error_message %}
    <div class="alert alert-warning" role="alert">
        {{ error_message }}
    </div>
{% endif %}
         <h1 class="login__title">Login</h1>

         <div class="login__content">
            <div class="login__box">
               <i class="ri-user-3-line login__icon"></i>

               <div class="login__box-input">
                  <input type="text" required class="login__input" name="username" placeholder=" ">
                  <label for="login-email" class="login__label">Username</label>
               </div>
            </div>

            <div class="login__box">
               <i class="ri-lock-2-line login__icon"></i>
               <div class="login__box-input">
                  <input type="password" required class="login__input" name="password" id="login-pass" placeholder=" ">
                  <label for="login-pass" class="login__label">Password</label>
                  <i class="ri-eye-off-line login__eye" id="login-eye"></i>
            </div>
         </div>

         <div class="login__check">
            <div class="login__check-group">
               <input type="checkbox" class="login__check-input" id="login-check" name="remember_me">
               <label for="login-check" class="login__check-label">Remember me</label>
            </div>
            <a href="{% url 'reset_password' %}" class="login__forgot">Forgot Password?</a>
         </div>

         <button  type="submit" class="login__button">Login</button>

         <p class="login__register">
            Don't have an account? <a href="{% url 'register' %}">Register</a><br><br>
            Register your Business <a style="color:  #c80000;" href="{% url 'register_business' %}">here.</a>                
         </p>
         </p>
      </form>
   </div>
       
   <script>
      document.addEventListener("DOMContentLoaded", function () {
          const passwordField = document.getElementById("login-pass");
          const eyeIcon = document.getElementById("login-eye");
  
          eyeIcon.addEventListener("click", function () {
              if (passwordField.type === "password") {
                  passwordField.type = "text";
                  eyeIcon.classList.remove('ri-eye-off-line');
                  eyeIcon.classList.add('ri-eye-line');
              } else {
                  passwordField.type = "password";
                  eyeIcon.classList.remove('ri-eye-line');
                  eyeIcon.classList.add('ri-eye-off-line');
              }
          });
      });
  </script>
