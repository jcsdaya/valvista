<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="{% static 'media/vlogos.png' %}" type="image/png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
 
    <title>Edit Business Owner | ValVista</title>
    <link rel="stylesheet" href="{% static 'edit.css' %}">
</head>
<header>
    <div style= "background-image: url('https://valenzuela.gov.ph/ckuploads/images/cityhall_facade.jpg'); background-size: cover;background-position: center;"></div>
    
    <nav>
        <div class="logo">
            <a href="{%url 'dashboard' %}"><img class="logo"src ="{% static 'media/valvista_logo.png' %}" alt="logo"></a>
        </div>

        <ul class="nav-links">
            <li><a href="{%url 'dashboard' %}"><i class="fa-solid fa-table-columns"></i> Dashboard</a></li>
            <li><a href="{%url 'placelist' %}"><i class="fa-solid fa-list"></i> Place List</a></li>
            <li><a href="{%url 'businessadmin' %}"><i class="fa-solid fa-list"></i></i> Business List</a></li>
            <li><a href="{%url 'approvallist' %}"><i class="fa-solid fa-check-to-slot"></i> Approval List</a></li>
            <li><a href="{%url 'archives' %}"><i class="fa-solid fa-box-archive"></i> Archive</a></li>
        </ul>
        <ul class="nav-links ul-user">
            <li class="no-hover"><a style="color: white;"><i class="fa-solid fa-user"></i> Welcome, <strong> {{request.user}}!</strong></a></li>
            <li><a href="{%url 'logout' %}"><i class="fa-solid fa-right-to-bracket"></i> Logout</a></li>
            
        </ul>
    </nav>
  </header>
<br><br><br><br>
<body>
<div class="right-box">
    <div class="header-text">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f9/Valenzuela_Seal.svg/768px-Valenzuela_Seal.svg.png" alt="Header Image">
        <h1>Edit Owner Details</h1>
    </div>

<div class="row">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Update</button>
        <a style="font-size: 20px;" href="{%url 'dashboard'%}"> Cancel</a>
    </form>
    </div>
</div>
</body>
</html>
