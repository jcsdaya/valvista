
<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="{% static 'media/vlogos.png' %}" type="image/png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/font-awesome.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Reset Password | ValVista</title>
    <link rel="stylesheet" href="{% static 'reset.css' %}">
</head>
<header>
    <div style= "background-image: url('https://valenzuela.gov.ph/ckuploads/images/cityhall_facade.jpg'); background-size: cover;background-position: center;"></div>
    
    <nav>
       <div class="logo">
           <a href="{% url 'home' %}"><img class="logo" src="{% static 'media/valvista_logo.png' %}" alt="logo"></a>
       </div>
   
       <!-- Burger icon for mobile -->
       <div class="burger" onclick="toggleMenu()">
           <i class="fa-solid fa-bars"></i>
       </div>
   
       <!-- Container for nav links and user-related elements -->
       <div class="nav-links-container">
           <!-- Nav links visible in the burger menu -->
           <ul class="nav-links">
               <li><a href="{% url 'home' %}"><i class="fa-solid fa-house"></i> Home</a></li>
           </ul>
   
           <!-- User links visible in the burger menu -->
           <ul class="nav-links ul-user">
               <li><a href="{% url 'login' %}"><i class="fa-solid fa-right-to-bracket"></i> Login</a></li>
           </ul>
       </div>
   </nav>

   
  </header>

     <!-- Script for burger menu -->
<!-- Script for burger menu -->
<script>
    // Toggle the navigation menu visibility on burger icon click
    function toggleMenu() {
        const navLinksContainer = document.querySelector('.nav-links-container');
        navLinksContainer.classList.toggle('active'); // This will trigger the slide animation
    }

    // Ensure burger visibility based on window size on page load
    window.addEventListener("load", function () {
        checkScreenSize();  // Check screen size when the page loads
    });

    // Adjust the visibility of the burger menu based on screen size
    function checkScreenSize() {
        const burger = document.querySelector('.burger');
        if (window.innerWidth <= 1024) { // Burger should be visible for screens <= 1024px
            burger.style.display = 'block';
        } else {
            burger.style.display = 'none';
        }
    }

    // Add an event listener to handle window resizing
    window.addEventListener("resize", function () {
        checkScreenSize(); // Re-check screen size on window resize
    });
</script>



<body>
    <div class="right-box">
        <div class="header-text">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f9/Valenzuela_Seal.svg/768px-Valenzuela_Seal.svg.png" alt="Header Image">
            <h1>Forgot Password</h1>
            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" class="email-input" placeholder="Enter your email" required>
                </div>
                <button type="submit" name="Send email">Submit</button>
            </form>
        </div>
    </div>
</body>
</html>
