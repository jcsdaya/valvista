<!DOCTYPE html>
<html lang="en">
<head>
  {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href='{% static "media/vlogos.png" %}' type="image/png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <title>Rating | ValVista</title>
    <link rel="stylesheet" href="{% static 'rating.css' %}">
</head>
<header>
<nav>
    <div class="logo">
        <a href="{%url 'home'%}" ><img  class="logo"src ='{% static "media/valvista_logo.png" %}' alt="logo"></a>
    </div>
</nav>
</header>
<br><br><br><br>
<body>

  {% if messages %}
  <div id="success-message" class="alert alert-success">
      {% for message in messages %}
          <p>{{ message }}</p>
      {% endfor %}
  </div>
  {% endif %}
<div class="right-box">
    <div class="header-text">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f9/Valenzuela_Seal.svg/768px-Valenzuela_Seal.svg.png" alt="Header Image">

<h1>Rate {{ place.name }}</h1>
<form method="POST">
    {% csrf_token %}
    
    <!-- Name field at the top -->
    <div class="form-group">
      <label for="id_name">Name:</label>
      <br>
      {{ form.name }}
    </div>
  
    <!-- Score (star rating) in the middle -->
    <div class="form-group star-rating">
      <label for="id_score">Rating:</label>
      <br>
      <div class="stars">
        <span class="star" data-value="1">&#9733;</span>
        <span class="star" data-value="2">&#9733;</span>
        <span class="star" data-value="3">&#9733;</span>
        <span class="star" data-value="4">&#9733;</span>
        <span class="star" data-value="5">&#9733;</span>
      </div>
      {{ form.score }}  <!-- Hidden input for the score value -->
    </div>
  
    <!-- Comment field at the bottom -->
    <div class="form-group">
      <label for="id_comment">Comment:</label>
      <br>
      {{ form.comment }}
    </div>
  
    <!-- Submit button -->
    <div class="form-group">
      <button type="submit">Submit</button>
    </div>
  </form>
  
  
</div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', function () {
const stars = document.querySelectorAll('.star');
const scoreInput = document.querySelector('input[name="score"]');

stars.forEach(star => {
star.addEventListener('click', function () {
  const ratingValue = this.getAttribute('data-value');
  scoreInput.value = ratingValue;
  highlightStars(ratingValue);
});

star.addEventListener('mouseover', function () {
  highlightStars(this.getAttribute('data-value'));
});

star.addEventListener('mouseout', function () {
  highlightStars(scoreInput.value);
});
});

function highlightStars(rating) {
stars.forEach(star => {
  if (star.getAttribute('data-value') <= rating) {
    star.classList.add('selected');
  } else {
    star.classList.remove('selected');
  }
});
}
const successMessage = document.getElementById('success-message');
          if (successMessage) {
              setTimeout(() => {
                  window.location.href = "{% url 'home' %}";
              }, 5000);  // Redirect after 5 seconds
          }
});

</script>
</body>
</html>
