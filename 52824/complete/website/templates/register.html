<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="..\media\media\vlogos.png" type="image/png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.1.3/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">
    <title>Register | ValVista</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'registerssss.css' %}">
</head>
<body>


    <nav>
        <div class="logo">
            <a href="{%url 'home' %}"><img class="logo"src ="..\media\media\valvista logo.png" alt="logo"></a>
        </div>

        <ul class="nav-links">
           
            <li><a href="{%url 'home' %}"><i class="fa-solid fa-house"></i> Home</a></li>
         </ul>
            <ul class="nav-links ul-user">
            <li><a href="{%url 'login' %}"><i class="fa-solid fa-right-to-bracket"></i> Login</a></li>
            
         </ul>
        
    </nav>
    </header>
      
    <div class="register-photo">
        <div class="form-container">
            <div class="image-holder"></div>
            <form method="post" action="">
                {% csrf_token %}
                {{ form.as_p }}
                <h2 class="text-center"><strong>Create</strong> an account</h2>
                <div class="form-group"><input class="form-control" type="email" name="email" placeholder="Email" required></div>
                <div class="form-group"><input class="form-control" type="text" name="username" placeholder="Username" required></div>
                <div class="form-group"><input class="form-control" type="password" name="password" placeholder="Password" required></div>
                <div class="form-group">
                    <div class="form-check"><label class="form-check-label"><input class="form-check-input" type="checkbox">I agree to the license terms.</label></div>
                </div>
                <div class="form-group"><button class="signup" type="submit">Sign Up</button></div>
                <p class="form-group">
                    You already have an account? <a style="color:  #c80000;" href="{% url 'login' %}">Login here.</a>
                </p>
                <p class="form-group">
                    Register your Business <a style="color:  #c80000;" href="{% url 'register_business' %}">here.</a>
                </p>
            </form>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.1.3/js/bootstrap.bundle.min.js"></script>
     <script>
      document.addEventListener("DOMContentLoaded", function () {
          const passwordField = document.getElementById("login-pass");
          const eyeIcon = document.getElementById("login-eye");
  
          eyeIcon.addEventListener("click", function () {
              if (passwordField.type === "password") {
                  passwordField.type = "text";
                  eyeIcon.classList.remove('ri-eye-off-line');
                  eyeIcon.classList.add('ri-eye-line');
              } else {
                  passwordField.type = "password";
                  eyeIcon.classList.remove('ri-eye-line');
                  eyeIcon.classList.add('ri-eye-off-line');
              }
          });
      });
  </script>
</body>
</html>
